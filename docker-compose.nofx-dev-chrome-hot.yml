version: '3.8'

services:
  binance-proxy:
    build:
      context: ./api/binance_proxy
      dockerfile: Dockerfile
      args:
        - HOT_RELOAD=false
    container_name: nofx-binance-proxy
    ports:
      - "8081:8081"
    environment:
      - HOT_RELOAD=false
    networks:
      - dev-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8081/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend.dev.watch
    container_name: nofx-dev-backend
    ports:
      - "8888:8888"
    volumes:
      - ./api:/app/api
      - ./auth:/app/auth
      - ./backtest:/app/backtest
      - ./config:/app/config
      - ./crypto:/app/crypto
      - ./debate:/app/debate
      - ./decision:/app/decision
      - ./hook:/app/hook
      - ./kernel:/app/kernel
      - ./launcher:/app/launcher
      - ./llm:/app/llm
      - ./logger:/app/logger
      - ./manager:/app/manager
      - ./market:/app/market
      - ./mcp:/app/mcp
      - ./provider:/app/provider
      - ./scripts:/app/scripts
      - ./security:/app/security
      - ./setup:/app/setup
      - ./store:/app/store
      - ./trader:/app/trader
      - ./web:/app/web
      - ./go.mod:/app/go.mod
      - ./go.sum:/app/go.sum
      - ./main.go:/app/main.go
      - ./data:/app/data # 数据库目录映射
    environment:
      - CHROME_HEADLESS=true
      - CHROME_BIN=/usr/bin/chromium-browser
      - PUPPETEER_SKIP_CHROMIUM_DOWNLOAD=true
      - LOG_LEVEL=debug

    networks:
      - dev-net
    working_dir: /app
    depends_on:
      - binance-proxy

    # 添加健康检查
    healthcheck:
      test: ["CMD", "sh", "-c", "ps aux | grep -v grep | grep air"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend.dev.watch
    container_name: nofx-dev-frontend
    ports:
      - "3300:3030"
    volumes:
      - ./web:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - VITE_API_TARGET=http://nofx-dev-backend:8888
    networks:
      - dev-net
    restart: unless-stopped
    depends_on:
      - backend

networks:
  dev-net:
    driver: bridge