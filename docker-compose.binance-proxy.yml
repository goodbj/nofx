version: '3.8'

services:
  binance-proxy:
    build:
      context: ./api/binance_proxy
      dockerfile: Dockerfile.simple
    container_name: binance-proxy
    ports:
      - "${BINANCE_PROXY_PORT:-8081}:${BINANCE_PROXY_INTERNAL_PORT:-8081}"
    environment:
      - PORT=${BINANCE_PROXY_INTERNAL_PORT:-8081}
      - GIN_MODE=release
      - DEBUG=false
    networks:
      - nofx-network
    restart: unless-stopped

networks:
  nofx-network:
    driver: bridge