version: '3.8'

services:
  backend:
    image: nofx_dev-backend
    container_name: nofx-dev-backend
    ports:
      - "8888:8888"
    volumes:
      - ./api:/app/api
      - ./auth:/app/auth
      - ./backtest:/app/backtest
      - ./config:/app/config
      - ./crypto:/app/crypto
      - ./debate:/app/debate
      - ./decision:/app/decision
      - ./hook:/app/hook
      - ./kernel:/app/kernel
      - ./launcher:/app/launcher
      - ./llm:/app/llm
      - ./logger:/app/logger
      - ./manager:/app/manager
      - ./market:/app/market
      - ./mcp:/app/mcp
      - ./provider:/app/provider
      - ./scripts:/app/scripts
      - ./security:/app/security
      - ./setup:/app/setup
      - ./store:/app/store
      - ./trader:/app/trader
      - ./web:/app/web
      - ./go.mod:/app/go.mod
      - ./go.sum:/app/go.sum
      - ./main.go:/app/main.go
      - ./data:/app/data # 确保数据目录可读写
    environment:
      - CHROME_HEADLESS=true
      - CHROME_BIN=/usr/bin/chromium-browser
      - PUPPETEER_SKIP_CHROMIUM_DOWNLOAD=true
      - LOG_LEVEL=debug
    networks:
      - dev-net
    working_dir: /app

  frontend:
    image: setup-nofx-dev-frontend
    container_name: nofx-dev-frontend
    ports:
      - "3300:5173"
    volumes:
      - ./web:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - VITE_API_TARGET=http://nofx-dev-backend:8888
    networks:
      - dev-net
    restart: unless-stopped

networks:
  dev-net:
    driver: bridge
