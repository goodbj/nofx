      - "DATA_ENCRYPTION_KEY=your-base64-encoded-32-byte-key"
      - "NOFX_BACKEND_PORT=8888"
      - "NOFX_FRONTEND_PORT=3300"
      - "LOG_LEVEL=info"
      - "DB_TYPE=sqlite"
      - "DB_PATH=data/data.db"
    volumes:
      # 源代码挂载实现热更新
      - ./api:/app/api
      - ./auth:/app/auth
      - ./backtest:/app/backtest
      - ./config:/app/config
      - ./crypto:/app/crypto
      - ./debate:/app/debate
      - ./decision:/app/decision
      - ./hook:/app/hook
      - ./kernel:/app/kernel
      - ./launcher:/app/launcher
      - ./llm:/app/llm
      - ./logger:/app/logger
      - ./manager:/app/manager
      - ./market:/app/market
      - ./mcp:/app/mcp
      - ./provider:/app/provider
      - ./scripts:/app/scripts
      - ./security:/app/security
      - ./setup:/app/setup
      - ./store:/app/store
      - ./trader:/app/trader
      - ./web:/app/web
      - ./go.mod:/app/go.mod
      - ./go.sum:/app/go.sum
      - ./main.go:/app/main.go
      # 数据持久化
      - ./storage:/app/storage  # Chrome用户数据和Cookie持久化
      - ./data:/app/data        # 数据库文件
      # X11显示支持
      - type: bind
        source: /tmp/.X11-unix
        target: /tmp/.X11-unix
        read_only: true
    networks:
      - nofx-dev-network
    working_dir: /app
    restart: unless-stopped

  # 前端服务 - 带热更新功能
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend.dev.watch
    container_name: nofx-dev-frontend-display
    ports:
      - "3300:3300"  # 使用3300端口，避免3000
    volumes:
      - ./web:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - VITE_API_TARGET=http://backend:8888
    networks:
      - nofx-dev-network
    depends_on:
      - backend
    restart: unless-stopped

# 网络配置
networks:
  nofx-dev-network:
    driver: bridge
    name: nofx-dev-network

# 数据卷配置
volumes:
  storage-data:
    driver: local
  database-data:
    driver: local