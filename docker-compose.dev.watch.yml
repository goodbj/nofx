version: '3.8'

services:
  nofx-backend-dev-watch:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend.dev.watch
    container_name: nofx-backend-dev-watch
    ports:
      - "8888:8888"
    volumes:
      # 挂载源代码目录以支持热重载
      - ./api:/app/api
      - ./auth:/app/auth
      - ./backtest:/app/backtest
      - ./config:/app/config
      - ./crypto:/app/crypto
      - ./debate:/app/debate
      - ./decision:/app/decision
      - ./hook:/app/hook
      - ./kernel:/app/kernel
      - ./launcher:/app/launcher
      - ./llm:/app/llm
      - ./logger:/app/logger
      - ./manager:/app/manager
      - ./market:/app/market
      - ./mcp:/app/mcp
      - ./provider:/app/provider
      - ./scripts:/app/scripts
      - ./security:/app/security
      - ./setup:/app/setup
      - ./store:/app/store
      - ./trader:/app/trader
      - ./web:/app/web
      - ./go.mod:/app/go.mod
      - ./go.sum:/app/go.sum
      - ./main.go:/app/main.go
    environment:
      - CHROME_HEADLESS=true
      - CHROME_BIN=/usr/bin/chromium-browser
      - PUPPETEER_SKIP_CHROMIUM_DOWNLOAD=true
    working_dir: /app
    # 添加健康检查
    healthcheck:
      test: ["CMD", "sh", "-c", "ps aux | grep -v grep | grep air"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s