services:
  # Backend service (API and core logic) - Development with Hot Reload
  nofx-dev-watch:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.backend.dev.watch
    container_name: nofx-trading-dev-watch
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "8888:8888"  # 使用您指定的后端端口
      - "6060:6060"  # pprof profiling
    volumes:
      - .:/app  # 挂载源代码目录，实现热重载
      - ./data:/app/data
      - /etc/localtime:/etc/localtime:ro
    working_dir: /app  # 设置工作目录
    command: >
      sh -c "
        go mod download &&
        go run main.go
      "
    env_file:
      - .env
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - AI_MAX_TOKENS=8000
      - NOFX_BACKEND_PORT=8888
    networks:
      - nofx-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8888/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Frontend service (Vite dev server with hot reload)
  nofx-frontend-dev-watch:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.frontend.dev.watch
    container_name: nofx-frontend-dev-watch
    restart: unless-stopped
    ports:
      - "3300:5173"  # Vite dev server port
    volumes:
      - ./web:/app  # 挂载前端源代码目录 for hot reload
      - /app/node_modules  # 卷挂载node_modules以避免覆盖容器中的依赖
    networks:
      - nofx-network
    depends_on:
      - nofx-dev-watch
    environment:
      - NODE_ENV=development
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5173"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  nofx-network:
    driver: bridge