version: '3.8'

services:
  # Backend service (API and core logic) - Production Version
  nofx-backend-prod:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.backend
    container_name: nofx-backend-prod
    restart: unless-stopped
    stop_grace_period: 30s  # 允许应用有 30 秒时间优雅关闭
    ports:
      - "8889:8888"  # 使用备用端口8889以避免冲突
      - "6061:6060"  # pprof profiling备用端口
    env_file:
      - .env
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - AI_MAX_TOKENS=8000
      - API_SERVER_PORT=8888  # 容器内服务端口
      - OLLAMA_READ_TIMEOUT=270s  # 🔥 Ollama超时设置（4.5分钟，基于实测AI调用176秒）
    networks:
      - nofx-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8888/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  nofx-network:
    external: true  # 使用外部网络，与主compose文件共享