version: '3.8'

services:
  binance-proxy:
    build:
      context: ./api/binance_proxy
      dockerfile: Dockerfile
    container_name: binance-proxy
    ports:
      - "8081:8080"
    environment:
      - PORT=8080
      - GIN_MODE=release
      - DEBUG=false
    networks:
      - nofx-network
    restart: unless-stopped

networks:
  nofx-network:
    driver: bridge