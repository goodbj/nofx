version: '3.8'

services:
  nofx-dev-watch:
    build:
      context: .
      dockerfile: ../docker/Dockerfile.backend.dev.watch
    container_name: nofx-trading-dev-watch
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "8888:8888"
    volumes:
      - ..:/app
      - ./data:/app/data
      - /etc/localtime:/etc/localtime:ro
    working_dir: /app
    command: >
      sh -c "
        go mod download &&
        go run main.go
      "
    env_file:
      - ../.env
    environment:
      - TZ=Asia/Shanghai
      - AI_MAX_TOKENS=8000
      - NOFX_BACKEND_PORT=8888
      - API_HOST=nofx-dev-watch
      - OLLAMA_READ_TIMEOUT=270s  # 🔥 Ollama超时设置（4.5分钟，基于实测AI调用176秒）
    networks:
      - nofx-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8888/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  nofx-frontend-dev-watch:
    build:
      context: .
      dockerfile: ../docker/Dockerfile.frontend.dev.watch
    container_name: nofx-frontend-dev-watch
    restart: unless-stopped
    ports:
      - "3300:5173"
    volumes:
      - ../web:/app
      - /app/node_modules
    networks:
      - nofx-network
    depends_on:
      - nofx-dev-watch
    environment:
      - NODE_ENV=development
      - VITE_API_TARGET=http://nofx-dev-watch:8888  # 🔥 通过Docker服务名访问后端
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5173"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  nofx-network:
    driver: bridge



