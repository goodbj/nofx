services:
  # Backend service (API and core logic) - Development Version
  nofx-dev:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.backend.dev
    container_name: nofx-trading-dev
    restart: unless-stopped
    stop_grace_period: 30s  # 允许应用有 30 秒时间优雅关闭
    ports:
      - "8888:8888"  # 使用您指定的后端端口
      - "6060:6060"  # pprof profiling
    volumes:
      - ./data:/app/data
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - .env
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - AI_MAX_TOKENS=8000
      - API_SERVER_PORT=8888  # 使用您指定的端口
    networks:
      - nofx-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8888/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Frontend service (static serving and proxy) - Development Version
  nofx-frontend-dev:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.frontend
    container_name: nofx-frontend-dev
    restart: unless-stopped
    ports:
      - "3300:80"  # 映射到您指定的前端端口
    networks:
      - nofx-network
    depends_on:
      - nofx-dev
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

networks:
  nofx-network:
    driver: bridge