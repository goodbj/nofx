version: '3.8'

# NOFX 开发版显示分组服务配置
# 为 "nofx_dev_display" 标签分组设计的前后端服务

services:
  # 后端服务 - 带浏览器显示功能
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend.dev.display
    container_name: nofx-dev-backend-display
    ports:
      - "8888:8888"  # 使用标准后端端口
    environment:
      - CHROME_HEADLESS=false  # 启用浏览器显示（关键配置）
      - CHROME_BIN=/usr/bin/chromium-browser
      - PUPPETEER_SKIP_CHROMIUM_DOWNLOAD=true
      - DISPLAY=:0  # X11显示配置
    volumes:
      # 源代码挂载实现热更新
      - ./api:/app/api
      - ./auth:/app/auth
      - ./backtest:/app/backtest
      - ./config:/app/config
      - ./crypto:/app/crypto
      - ./debate:/app/debate
      - ./decision:/app/decision
      - ./hook:/app/hook
      - ./kernel:/app/kernel
      - ./launcher:/app/launcher
      - ./llm:/app/llm
      - ./logger:/app/logger
      - ./manager:/app/manager
      - ./market:/app/market
      - ./mcp:/app/mcp
      - ./provider:/app/provider
      - ./scripts:/app/scripts
      - ./security:/app/security
      - ./setup:/app/setup
      - ./store:/app/store
      - ./trader:/app/trader
      - ./web:/app/web
      - ./go.mod:/app/go.mod
      - ./go.sum:/app/go.sum
      - ./main.go:/app/main.go
      # 数据持久化
      - ./storage:/app/storage
      - ./data:/app/data
      # X11显示支持（Windows需要配置）
      - type: bind
        source: /tmp/.X11-unix
        target: /tmp/.X11-unix
        read_only: true
    networks:
      - nofx-dev-display-network
    working_dir: /app
    restart: unless-stopped

  # 前端服务
  frontend:
    build:
      context: ./web
      dockerfile: ../docker/Dockerfile.frontend.dev.watch
    container_name: nofx-dev-frontend-display
    ports:
      - "3300:5173"  # 使用标准前端端口
    volumes:
      - ./web:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - VITE_API_TARGET=http://backend:8888  # 使用服务名通信
    networks:
      - nofx-dev-display-network
    depends_on:
      - backend
    restart: unless-stopped

# 网络配置
networks:
  nofx-dev-display-network:
    driver: bridge

# 数据卷配置
volumes:
  storage-data:
    driver: local
  database-data:
    driver: local