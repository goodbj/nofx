services:
  nofx-proxy-hot:
    build:
      context: .
      dockerfile: Dockerfile.hot
    container_name: tools_docker_proxy
    ports:
      - "${PROXY_PORT:-8081}:8081"
    volumes:
      - .:/app  # 挂载源代码目录以支持热更新
    environment:
      - PORT=8081
      - GIN_MODE=debug  # 启用调试模式以便看到实时日志
    restart: unless-stopped
    networks:
      - nofx-proxy-network

networks:
  nofx-proxy-network:
    driver: bridge