version: '3.8'

services:
  nofx-proxy:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tools_docker_proxy
    ports:
      - "${PROXY_PORT:-8081}:8081"
    environment:
      - PORT=8081
      - GIN_MODE=release
    restart: unless-stopped
    networks:
      - nofx-proxy-network

networks:
  nofx-proxy-network:
    driver: bridge