root = .
tmp_dir = /tmp/air

[build]
cmd = "go build -o ./tmp/main ."
bin = "./tmp/main"
full_bin = "./tmp/main"
include_ext = ["go", "mod", "sum"]
exclude_dir = ["tmp", "vendor"]
include_dir = []
exclude_file = []
exclude_regex = []
exclude_unchanged = false
follow_symlink = false
log = "build-errors.log"
stop_on_error = true
send_interrupt = false
kill_delay = 500
rerun = false
rerun_delay = 500