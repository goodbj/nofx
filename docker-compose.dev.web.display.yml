version: '3.8'

services:
  nofx-dev-backend-display:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend.dev.chrome.dev
    container_name: nofx-dev-backend-display
    ports:
      - "8888:8888"
    environment:
      - CHROME_HEADLESS=false  # 启用浏览器显示（非无头模式）
      - CHROME_BIN=/usr/bin/chromium-browser
      - PUPPETEER_SKIP_CHROMIUM_DOWNLOAD=true
      - API_SERVER_PORT=8888
      - OLLAMA_READ_TIMEOUT=270s
      - TZ=Asia/Shanghai
    volumes:
      # 代码热更新卷 - 这些目录会被实时同步到容器内
      - ./api:/app/api
      - ./auth:/app/auth
      - ./backtest:/app/backtest
      - ./config:/app/config
      - ./crypto:/app/crypto
      - ./debate:/app/debate
      - ./decision:/app/decision
      - ./hook:/app/hook
      - ./kernel:/app/kernel
      - ./launcher:/app/launcher
      - ./llm:/app/llm
      - ./logger:/app/logger
      - ./manager:/app/manager
      - ./market:/app/market
      - ./mcp:/app/mcp
      - ./provider:/app/provider
      - ./scripts:/app/scripts
      - ./security:/app/security
      - ./setup:/app/setup
      - ./store:/app/store
      - ./trader:/app/trader
      - ./web:/app/web
      - ./go.mod:/app/go.mod
      - ./go.sum:/app/go.sum
      - ./main.go:/app/main.go
      # Cookie和数据持久化卷
      - ./data:/app/data  # 数据库文件持久化
      - ./guardian/chrome_profile:/home/chrome/.config/chromium  # Chrome配置和Cookie持久化
    networks:
      - dev-display-net
    working_dir: /app
    # 注意：为支持热更新，暂时禁用重启策略
    # restart: unless-stopped

  nofx-dev-frontend-display:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend.dev
    container_name: nofx-dev-frontend-display
    ports:
      - "3300:3000"  # 前端端口映射
    environment:
      - VITE_API_BASE_URL=http://host.docker.internal:8888  # API服务器地址，指向宿主机的后端服务
      - NODE_ENV=development
    volumes:
      # 源码热更新挂载
      - ./web:/app/web
      # 注意：不再挂载单个package.json文件，因为Dockerfile已经复制了这些文件
    depends_on:
      - nofx-dev-backend-display  # 确保后端服务先启动
    networks:
      - dev-display-net
    # 注意：为支持热更新，暂时禁用重启策略
    # restart: unless-stopped

networks:
  dev-display-net:
    driver: bridge